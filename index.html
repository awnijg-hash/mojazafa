<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تحدي البومب - التصميم الأصلي مع تخزين الأسماء</title>
<style>
  @import url('https://fonts.cdnfonts.com/css/habeba');
  @import url('https://fonts.googleapis.com/css2?family=Almarai:wght@800&display=swap');
  * { -webkit-tap-highlight-color: transparent; outline: none; user-select: none; box-sizing: border-box; }
  
  body { margin: 0; padding: 0; background: radial-gradient(circle at center, #fceabb 0%, #fccd4d 50%, #f8b500 100%) !important; font-family: 'Habeba', sans-serif; color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  
  .top-frame, .game-frame { margin: 2px; border: none !important; background: transparent !important; }
  .top-bar { height: 100%; background: transparent !important; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px; gap: 2px; position: relative; }
  .game-frame { flex: 1; margin: 5px; background: transparent !important; }

  .bomb-balls { position: absolute; left: 5px; top: 10px; display: flex; gap: 4px; z-index: 20; }
  .ball { width: 10px; height: 10px; background-color: #ff0000; border-radius: 50%; box-shadow: 0 0 5px red; }
  .sum-box { width: 100%; height: 70px; background: #000; border: 2px solid #fff; color: #fff; text-align: center; font-size: 45px; font-weight: 900; line-height: 65px; border-radius: 4px; margin-bottom: 5px; }
  .main-row { display: flex; align-items: stretch; justify-content: center; gap: 5px; width: 100%; height: 70px; }
  .neon-rect { background: #000; border: 2px solid #00f2ff; box-shadow: 0 0 10px #00f2ff; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 4px; flex: 1; font-size: 24px; font-weight: 900; }
  .title-center { flex: 2; background: #000; border: 2px solid #ff00ff; border-radius: 4px; display: flex; align-items: center; justify-content: center; position: relative; box-shadow: 0 0 15px #ff00ff; }
  .tufuli-neon { font-family: 'Almarai', sans-serif; color: #ff00ff; font-size: 18px; font-weight: 900; text-align: center; position: absolute; transition: opacity 1s; width: 100%; }
  
  .modal { position: fixed; inset: 0; background: radial-gradient(circle at center, rgba(252, 234, 187, 0.98) 0%, rgba(248, 181, 0, 0.98) 100%); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 10px; }
.modal-box { 
    background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
    border: 4px solid #000; 
    border-radius: 30px; 
    width: 100%; 
    max-width: 480px; 
    padding: 25px; 
    text-align: center; 
    box-shadow: 0 0 25px rgba(184, 134, 11, 0.6);
    position: relative;
    overflow: hidden;
    animation: goldShine 3s infinite alternate;
}

/* التوهج المعدني المتحرك */
@keyframes goldShine {
    0% { background-position: 0% 50%; border-color: #555; }
    100% { background-position: 100% 50%; border-color: gold; }
}  .modal-title { font-family: 'Almarai', sans-serif; font-size: 28px; color: #000; text-shadow: none; margin-bottom: 20px; font-weight: 900; }
  
  .team-inputs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .team-input { width: 100%; padding: 10px; border-radius: 10px; border: 3px solid #000; background: #fff; color: #000; font-family: 'Habeba'; font-size: 22px; text-align: center; }
  .opt-row { display: flex; justify-content: space-around; margin: 15px 0; background: rgba(0,0,0,0.1); padding: 12px; border-radius: 12px; border: 2px solid #000; color: #000; font-weight: 900; }
  select { padding: 8px; border-radius: 8px; background: #000; color: gold; border: 2px solid gold; font-family: 'Habeba'; font-size: 20px; }
  
  .start-btn { width: 100%; padding: 18px; background: #000; color: gold; font-weight: 900; font-size: 24px; border-radius: 15px; border: 2px solid gold; font-family: 'Habeba'; cursor: pointer; margin-top: 10px; box-shadow: 0 5px 0 #333; transition: 0.1s; }
  .start-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #333; }
  
  .teams-row { display: flex; gap: 5px; justify-content: center; width: 100%; height: 45%; margin-top: 5px; flex-wrap: wrap; }
  .team-box { min-width: 60px; flex: 1; height: 100%; border-radius: 12px; border: 3.5px solid #333; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5px; transition: 0.3s; }
  .team-box.active { border-color: #ccff00; box-shadow: 0 0 30px #ccff00, inset 0 0 15px #ccff00; background: #0a1f0a; transform: scale(1.03); }
  
  .t-name { background:transparent; border:none; color:gold; text-align:center; width:100%; font-weight:900; font-size:18px; }
  .t-score { background:transparent; border:none; color:white; text-align:center; width:100%; font-weight:900; font-size:40px; }
  
  .game-area { height: 100%; width: 100%; display: flex; justify-content: center; align-items: center; padding: 5px; }
  .grid-container { display: grid; gap: 6px; width: 100%; height: 100%; max-width: 50vh; padding: 20px; grid-template-columns: repeat(5, 1fr); grid-auto-rows: 1fr; }
  
  .square { background: radial-gradient(circle at 40% 40%, #2c3e50, #000); border-radius: 8px; border: 1.5px solid #444; position: relative; cursor: pointer; transform-style: preserve-3d; transition: transform 0.6s; box-shadow: 0 5px 0 #111; display: flex; align-items: center; justify-content: center; }
  .outer-num { color: #a3e635; text-shadow: 2px 2px 4px #000; font-size: 4.2vh; font-weight: 900; z-index: 2; }
  .inner-face { position: absolute; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 4.2vh; font-weight: 900; transform: rotateY(180deg); backface-visibility: hidden; border-radius: 8px; }
  .square.open .outer-num { display: none; }
  .square.open { transform: rotateY(180deg); }
  .bg-white-special { background: #ffffff !important; color: #000 !important; }
  .bg-red { background: #7f1d1d; } .bg-green { background: #14532d; } .bg-blue { background: #1e3a8a; } .bg-yellow { background: #a16207; } .bg-purple { background: #581c87; }
  .square.shatter { animation: shatterAnim 0.8s forwards; pointer-events: none; }
  @keyframes shatterAnim { 0% { transform: rotateY(180deg) scale(1); opacity: 1; } 100% { transform: rotateY(180deg) scale(0) rotate(20deg); opacity: 0; } }
  .shake { animation: shakeAnim 0.8s both; }
  @keyframes shakeAnim { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } }
</style>
</head>
<body onclick="initAudio(); tryFS();">

<datalist id="namesList"></datalist>

<div class="modal" id="settingsModal" style="display:flex;">
  <div class="modal-box">
    <div class="modal-title">العب بومب مع حسام</div>
    <div class="opt-row"><span>عدد الفرق:</span><select id="teamCountSel" onchange="generateInputs()"><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select></div>
<div id="teamArea" class="team-inputs-grid"></div>

<div class="opt-row" style="margin-top:20px;">
    <select id="gridSizeSel">
        <option value="25">25 مربع</option>
        <option value="40" selected>40 مربع</option> <option value="50">50 مربع</option>
    </select>
    <select id="bombCountSel">
        <option value="4">4 قنابل</option>
        <option value="3">3</option>

</div>

</div>

<div class="top-frame" id="p1">
  <div class="top-bar">
    <div class="bomb-balls">
        <div class="ball" id="ball1"></div>
        <div class="ball" id="ball2"></div>
    </div>
    <div class="sum-box" id="currentSum">0</div>
<div class="main-row">
    <div class="neon-rect" onclick="openSettings()">إعدادات</div>
    
    <div class="title-center" onclick="undoSquare()" style="cursor: pointer; position: relative;">
    <div id="text1" class="tufuli-neon" style="opacity: 1; transition: opacity 0.5s;">العب بومب<br>مع حسام</div>
    <div id="text2" class="tufuli-neon" style="opacity: 0; transition: opacity 0.5s;">أرحبوا جميعًا<br>يا إخوان 🥰</div>
</div>
    
    <div class="neon-rect" onclick="nextTurn()">اسحب</div>
</div>    <div class="teams-row" id="teamsList"></div>
  </div>
</div>

<div class="game-frame" id="p2">
  <div class="game-area"><div class="grid-container" id="gameGrid"></div></div>
</div>

<script>
   const goldenPack40 = [
    // الرقم 9 (أحمر، أخضر، بنفسجي)
    {t: 'n', v: 9, c: 'bg-red'}, {t: 'n', v: 9, c: 'bg-green'}, {t: 'n', v: 9, c: 'bg-purple'},
    // الرقم 8 (أزرق، أصفر، أحمر)
    {t: 'n', v: 8, c: 'bg-blue'}, {t: 'n', v: 8, c: 'bg-yellow'}, {t: 'n', v: 8, c: 'bg-red'},
    // الرقم 7 (أخضر، بنفسجي، أزرق)
    {t: 'n', v: 7, c: 'bg-green'}, {t: 'n', v: 7, c: 'bg-purple'}, {t: 'n', v: 7, c: 'bg-blue'},
    // الرقم 6 (أصفر، أحمر، أخضر)
    {t: 'n', v: 6, c: 'bg-yellow'}, {t: 'n', v: 6, c: 'bg-red'}, {t: 'n', v: 6, c: 'bg-green'},
    // الرقم 5 (أزرق، بنفسجي، أصفر)
    {t: 'n', v: 5, c: 'bg-blue'}, {t: 'n', v: 5, c: 'bg-purple'}, {t: 'n', v: 5, c: 'bg-yellow'},
    // الرقم 4 (أحمر، أخضر، أزرق)
    {t: 'n', v: 4, c: 'bg-red'}, {t: 'n', v: 4, c: 'bg-green'}, {t: 'n', v: 4, c: 'bg-blue'},
    // الرقم 3 (أحمر، أخضر، بنفسجي)
    {t: 'n', v: 3, c: 'bg-red'}, {t: 'n', v: 3, c: 'bg-green'}, {t: 'n', v: 3, c: 'bg-purple'},
    // الرقم 2 (أزرق، أصفر)
    {t: 'n', v: 2, c: 'bg-blue'}, {t: 'n', v: 2, c: 'bg-yellow'},
    // الرقم 1 (أحمر، أخضر، أزرق)
    {t: 'n', v: 1, c: 'bg-red'}, {t: 'n', v: 1, c: 'bg-green'}, {t: 'n', v: 1, c: 'bg-blue'},
    
    // 7 مربعات إضافية من الأرقام المتوسطة (لإكمال الـ 33 مربعاً):
    {t: 'n', v: 6, c: 'bg-blue'}, {t: 'n', v: 5, c: 'bg-red'}, {t: 'n', v: 4, c: 'bg-yellow'},
    {t: 'n', v: 6, c: 'bg-purple'}, {t: 'n', v: 5, c: 'bg-green'}, {t: 'n', v: 4, c: 'bg-purple'},
    {t: 'n', v: 9, c: 'bg-yellow'}
];
 let currentTurnHistory = []; // سجل يحفظ كل حركة في الدور الحالي {id, value, type}   
 let lastTurnScore = 0; // لحفظ سكور آخر دور عشان نقدر نرجع عنه   
 let gameHistory = []; // مصفوفة لحفظ تاريخ اللعبة   
 let openedCount = 0; // هذا عداد المربعات التي تفتحها 
let teams = [], currentTeamIdx = 0, turnPicks = [], isProcessing = false, audioCtx, cycleInterval, ballsCount = 2;

// --- دالة التخزين الذاتي ---
function saveNamesToStorage() {
    const names = teams.map(t => t.name);
    let savedNames = JSON.parse(localStorage.getItem('savedNames') || '[]');
    names.forEach(name => { if (!savedNames.includes(name)) savedNames.push(name); });
    localStorage.setItem('savedNames', JSON.stringify(savedNames));
    updateDataList();
}
function saveState() {
    gameHistory.push({
        teams: JSON.parse(JSON.stringify(teams)),
        turnPicks: JSON.parse(JSON.stringify(turnPicks)),
        currentTeamIdx: currentTeamIdx,
        ballsCount: ballsCount,
        // حفظ حالة المربعات المفتوحة
        openedIds: Array.from(document.querySelectorAll('.square.open')).map(el => el.id)
    });
}

function undoSquare() {
    if (currentTurnHistory.length === 0) return;

    // استرجاع آخر حركة
    let lastMove = currentTurnHistory.pop();
    let sq = document.getElementById(lastMove.id);

    // 1. إعادة المربع بصرياً (إغلاق)
    if (sq) {
        sq.classList.remove('open', 'shatter');
        sq.style.opacity = '1';
    }

    // 2. استعادة السكور الأصلي
    teams[lastMove.teamIdx].score = lastMove.scoreBefore;

    // 3. تحديث الدور
    currentTeamIdx = lastMove.teamIdx;

    // 4. حذف الحركة من السجل المؤقت للجمع
    if (turnPicks.length > 0) {
        turnPicks.pop();
    }

    // 5. تحديث الشاشة فوراً
    updateSum();
    renderTeams();
}

function calculateTotal(picks) {
    let sum = 0;
    let multiplier = 1;

    picks.forEach(pick => {
        // افترضنا أن 't' هو النوع و 'v' هي القيمة
        if (pick.t === 'n') { // 'n' تعني Number
            sum += pick.v;
        } else if (pick.t === 'm') { // 'm' تعني Multiplier
            sum *= pick.v; 
        }
    });
    return sum;
}
function updateDataList() {
    const savedNames = JSON.parse(localStorage.getItem('savedNames') || '[]');
    const list = document.getElementById('namesList');
    if(list) list.innerHTML = savedNames.map(n => `<option value="${n}">`).join('');
}
window.onload = updateDataList;

function updateSum() { 
    let total = 0; 
    
    turnPicks.forEach((p) => { 
        if (p.t === 'n') {
            // إضافة قيمة الرقم للمجموع
            total += p.v; 
        } else if (p.t === 'x') {
            // منطق المضاعف:
            // إذا كان المجموع 0، نتركه 0 (لأن 0 × أي شيء = 0)
            // إذا كان المجموع أكثر من 0، نضربه في قيمة المضاعف (p.v)
            if (total > 0) {
                total *= p.v;
            }
        }
    }); 
    
    // تحديث الشاشة
    const sumDisplay = document.getElementById('currentSum');
    if (sumDisplay) {
        sumDisplay.innerText = total;
    }
}

function generateInputs() {
    const count = document.getElementById('teamCountSel').value;
    const area = document.getElementById('teamArea');
    area.innerHTML = ''; 
    
    for(let i = 1; i <= count; i++) {
        let input = document.createElement('input');
        input.type = 'text';
        input.id = `t${i}`;
        input.className = 'team-input';
        
        // هنا جعلناها فارغة تماماً (بدون placeholder أو value مسبق)
        input.value = ''; 
        
        // ربطها بالقائمة المنسدلة
        input.setAttribute('list', 'namesList'); 
        
        // تعديل بسيط: عند الضغط داخل الخانة، نقوم بتحديد النص إذا كان موجوداً ليسهل مسحه أو الكتابة فوقه
        input.onclick = function() { this.select(); };
        
        input.style.marginBottom = '10px';
        area.appendChild(input);
    }
}
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function tryFS() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); }
function startNewGame() {
    function startNewGame() {
    // السطرين هذول هما مفتاح الحل لمشاكل هواوي والتعليق:
    const grid = document.getElementById('gameGrid');
    grid.innerHTML = ''; 
    grid.style.display = 'none'; 
    grid.offsetHeight; 
    grid.style.display = 'grid'; 

    // ... (باقي كودك الموجود في الصورة) ...
}
    console.log("جارٍ إعادة ضبط اللعبة بالكامل...");

    // 1. تصفير المتغيرات العامة (إعادة ضبط الذاكرة)
    currentTurnHistory = [];
    turnPicks = [];
    isProcessing = false;
    currentTeamIdx = 0; // دائماً نبدأ من الفريق الأول
    ballsCount = parseInt(document.getElementById('bombCountSel').value) || 2;

    // 2. تصفير سكور الفرق وإعادة ضبط الواجهة
    const names = []; 
    let teamCount = document.getElementById('teamCountSel').value || 2;
    for(let i=1; i<=teamCount; i++) {
        let val = document.getElementById(`t${i}`) ? document.getElementById(`t${i}`).value : "";
        names.push(val || `فريق ${i}`); 
    }
    teams = names.map((name, i) => ({id: i, score: 0, name: name})); 

    // 3. إعادة تحديث عداد القنابل البصري
    document.querySelectorAll('.ball').forEach((b, idx) => {
        b.style.display = (idx < ballsCount) ? 'block' : 'none';
    });

    // 4. بناء شبكة جديدة كلياً
    // هذا السطر يمسح الـ Grid القديم ويبني واحداً جديداً بالكامل
    setupGrid(parseInt(document.getElementById('gridSizeSel').value) || 40, ballsCount); 

    // 5. إغلاق القائمة وبدء العمل
    document.getElementById('settingsModal').style.display = 'none'; 
    saveNamesToStorage();
    renderTeams(); 
    updateSum();
}
function renderTeams() { const container = document.getElementById('teamsList'); container.innerHTML = teams.map((t, i) => `
    <div class="team-box ${i === currentTeamIdx ? 'active' : ''}" id="box-${i}">
        <input class="t-name" value="${t.name}" onchange="teams[${i}].name = this.value">
        <input class="t-score" value="${t.score}" onchange="teams[${i}].score = parseInt(this.value)">
    </div>`).join(''); }
    
function setupGrid(total, bombs) {
    
    const grid = document.getElementById('gameGrid');
    grid.innerHTML = '';
    grid.style.display = 'none'; 
    grid.offsetHeight; 
    grid.style.display = 'grid'; 

    isProcessing = false; 
    turnPicks = []; 
    currentTurnHistory = [];
    
    let pool = []; 

    // --- 1. تجهيز محتويات الشبكة حسب النمط ---
    if (total == 40) {
        let bombQty = bombs;
        for(let i = 0; i < bombQty; i++) pool.push({t: 'b', v: 0, c: 'bg-white-special'});
        for(let i = 0; i < 3; i++) pool.push({t: 'x', v: 2, c: 'bg-white-special'});
        for(let i = 0; i < 2; i++) pool.push({t: 'x', v: 3, c: 'bg-white-special'});
        
        let poolNumbers = [...goldenPack40]; 
        let needed = total - pool.length;
        for(let i = 0; i < needed; i++) {
            let randomIndex = Math.floor(Math.random() * poolNumbers.length);
            pool.push(poolNumbers.splice(randomIndex, 1)[0]);
        }
    } 
    else if (total == 25) {
        pool.push({t: 'b', v: 0, c: 'bg-white-special'}); 
        pool.push({t: 'x', v: 2, c: 'bg-white-special'}); 
        pool.push({t: 'x', v: 3, c: 'bg-white-special'}); 
        
        const colors = ['bg-red', 'bg-green', 'bg-blue', 'bg-yellow', 'bg-purple'];
        let standardPool = [];
        for (let v = 1; v <= 9; v++) {
            colors.forEach(c => standardPool.push({t: 'n', v: v, c: c}));
        }
        shuffleArray(standardPool);
        
        let neededNumbers = total - pool.length;
        for(let i = 0; i < neededNumbers; i++) {
            pool.push(standardPool[i % standardPool.length]);
        }
    }
    else {
        let bombQty = bombs;
        for(let i = 0; i < bombQty; i++) pool.push({t: 'b', v: 0, c: 'bg-white-special'});
        
        const colors = ['bg-red', 'bg-green', 'bg-blue', 'bg-yellow', 'bg-purple'];
        let standardPool = [];
        for (let v = 1; v <= 9; v++) {
            colors.forEach(c => standardPool.push({t: 'n', v: v, c: c}));
        }
        shuffleArray(standardPool);
        
        let neededNumbers = total - pool.length;
        for(let i = 0; i < neededNumbers; i++) {
            pool.push(standardPool[i % standardPool.length]);
        }
    }

    // --- 2. خوارزمية التوزيع الذكي (المشطوف) لمنع التكدس ---
    // بدلاً من الخلط العشوائي الكامل الذي يصنع تكتلات، نقوم بترتيب العناصر
    // بحيث لا يتجاور عنصران يحملان نفس القيمة أو اللون أفقياً أو عمودياً قدر الإمكان.
    let organizedPool = [];
    let remaining = [...pool];
    
    while(remaining.length > 0) {
        // نختار عنصراً لا يشبه آخر عنصر تم إضافته للمصفوفة المنظمة إن أمكن
        let bestIndex = 0;
        let lastAdded = organizedPool[organizedPool.length - 1];
        
        if (lastAdded) {
            for (let i = 0; i < remaining.length; i++) {
                let candidate = remaining[i];
                // تفضيل العناصر المختلفة كلياً عن الجار الأخير
                if (candidate.v !== lastAdded.v && candidate.c !== lastAdded.c) {
                    bestIndex = i;
                    break;
                }
            }
        }
        organizedPool.push(remaining.splice(bestIndex, 1)[0]);
    }
    
    pool = organizedPool;

    // --- 3. رسم الشبكة ---
    pool.forEach((d, i) => {
        const sq = document.createElement('div');
        sq.className = 'square';
        sq.id = 'sq-' + i;
        sq.innerHTML = `<span class="outer-num">${i+1}</span><div class="inner-face ${d.c}">${(d.t==='b'?'💣':(d.t==='x'?'x'+d.v:d.v))}</div>`;
        
        sq.onclick = () => {
            if(isProcessing || sq.classList.contains('open')) return;
            sq.classList.add('open');
            currentTurnHistory.push({ id: sq.id, data: d, teamIdx: currentTeamIdx, scoreBefore: teams[currentTeamIdx].score });
            if(d.t === 'b') { isProcessing = true; setTimeout(() => triggerExplosion(), 400); }
            else if(turnPicks.some(p => (p.c === d.c && p.t === 'n' && d.t === 'n') || (p.v === d.v && p.t === 'n' && d.t === 'n'))) {
                isProcessing = true; turnPicks = []; setTimeout(resetTurn, 1000);
            } else { turnPicks.push(d); updateSum(); }
        };
        grid.appendChild(sq);
    });

    // (مؤقت للاختبار: يمكنك حذفه لاحقاً)
    setTimeout(() => {
        document.querySelectorAll('.square').forEach(sq => sq.classList.add('open'));
    }, 500);
}
function setupGrid(total, bombs) {
    
    const grid = document.getElementById('gameGrid');
    grid.innerHTML = '';
    grid.style.display = 'none'; 
    grid.offsetHeight; 
    grid.style.display = 'grid'; 

    isProcessing = false; 
    turnPicks = []; 
    currentTurnHistory = [];
    
    const cols = 5; 
    const rows = total / cols; 
    let gridMatrix = Array(rows).fill().map(() => Array(cols).fill(null));
    const colors = ['bg-red', 'bg-green', 'bg-blue', 'bg-yellow', 'bg-purple'];

    // --- 1. تقسيم اللوحة إلى 4 أرباع هندسية دقيقة ومتساوية ---
    let midR = Math.floor(rows / 2);
    let midC = Math.floor(cols / 2);
    let sectors = [
        { rMin: 0, rMax: midR, cMin: 0, cMax: midC },          // الربع الأعلى-اليسار
        { rMin: 0, rMax: midR, cMin: midC, cMax: cols },      // الربع الأعلى-اليمين
        { rMin: midR, rMax: rows, cMin: 0, cMax: midC },      // الربع الأسفل-اليسار
        { rMin: midR, rMax: rows, cMin: midC, cMax: cols }     // الربع الأسفل-اليمين
    ];

    // --- 2. تجهيز العناصر الخاصة بدقة حسب النمط (الـ 25 بقنبلة واحدة ومضاعفين، والـ 40 حسب المطلوب) ---
    let specialItems = [];
    
    if (total == 40) {
        let bombQty = bombs; // القنابل حسب إعدادات نمط 40
        for(let i = 0; i < bombQty; i++) specialItems.push({t: 'b', v: 0, c: 'bg-white-special'});
        for(let i = 0; i < 3; i++) specialItems.push({t: 'x', v: 2, c: 'bg-white-special'});
        for(let i = 0; i < 2; i++) specialItems.push({t: 'x', v: 3, c: 'bg-white-special'});
    } else if (total == 25) {
        specialItems.push({t: 'b', v: 0, c: 'bg-white-special'}); // قنبلة واحدة فقط للنمط 25
        specialItems.push({t: 'x', v: 2, c: 'bg-white-special'}); // مضاعف x2 واحد
        specialItems.push({t: 'x', v: 3, c: 'bg-white-special'}); // مضاعف x3 واحد
    }

    shuffleArray(specialItems);

    // توزيع العناصر الخاصة على الأرباع مع نظام تباعد وفحص دقيق لعدم التكتل
    specialItems.forEach((item, itemIdx) => {
        let bestR = -1, bestC = -1;
        let maxMinDist = -1;
        let targetSec = sectors[itemIdx % sectors.length]; 

        let candidateSlots = [];
        for (let r = targetSec.rMin; r < targetSec.rMax; r++) {
            for (let c = targetSec.cMin; c < targetSec.cMax; c++) {
                if (gridMatrix[r][c] === null) candidateSlots.push({r, c});
            }
        }
        
        if (candidateSlots.length === 0) {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (gridMatrix[r][c] === null) candidateSlots.push({r, c});
                }
            }
        }

        shuffleArray(candidateSlots);

        candidateSlots.forEach(slot => {
            let minDistToOther = Infinity;
            for (let pr = 0; pr < rows; pr++) {
                for (let pc = 0; pc < cols; pc++) {
                    if (gridMatrix[pr][pc] && gridMatrix[pr][pc].c === 'bg-white-special') {
                        let dist = Math.abs(slot.r - pr) + Math.abs(slot.c - pc);
                        if (dist < minDistToOther) minDistToOther = dist;
                    }
                }
            }
            if (minDistToOther > maxMinDist) {
                maxMinDist = minDistToOther;
                bestR = slot.r;
                bestC = slot.c;
            }
        });

        if (bestR !== -1 && bestC !== -1) {
            gridMatrix[bestR][bestC] = item;
        }
    });

    // --- 3. تجهيز حزمة الأرقام والألوان الكاملة والفريدة ---
    let standardPool = [];
    if (total == 40) {
        standardPool = [...goldenPack40];
    } else {
        for (let v = 1; v <= 9; v++) {
            colors.forEach(c => standardPool.push({t: 'n', v: v, c: c}));
        }
    }
    
    shuffleArray(standardPool);

    let emptyCoords = [];
    for(let r = 0; r < rows; r++) {
        for(let c = 0; c < cols; c++) {
            if(gridMatrix[r][c] === null) emptyCoords.push({r, c});
        }
    }

    let balancedNumbers = [];
    while(balancedNumbers.length < emptyCoords.length) {
        let temp = [...standardPool];
        shuffleArray(temp);
        balancedNumbers = balancedNumbers.concat(temp);
    }
    balancedNumbers = balancedNumbers.slice(0, emptyCoords.length);
    shuffleArray(balancedNumbers);

    // --- 4. تعبئة الخلايا العادية بفرض قاعدة التباعد الموسع لتمكين المجازفة ---
    emptyCoords.forEach(coord => {
        let r = coord.r;
        let c = coord.c;
        let chosenItem = null;
        let bestIndex = 0;
        let minPenalty = Infinity;
        
        for (let i = 0; i < balancedNumbers.length; i++) {
            let candidate = balancedNumbers[i];
            let penalty = 0;
            
            for (let dr = -2; dr <= 2; dr++) {
                for (let dc = -2; dc <= 2; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    let nr = r + dr;
                    let nc = c + dc;
                    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                        let neighbor = gridMatrix[nr][nc];
                        if (neighbor && neighbor.t === 'n') {
                            if (neighbor.v === candidate.v) penalty += (3 - Math.max(Math.abs(dr), Math.abs(dc)));
                            if (neighbor.c === candidate.c) penalty += (2 - Math.max(Math.abs(dr), Math.abs(dc)));
                        }
                    }
                }
            }

            if (penalty < minPenalty) {
                minPenalty = penalty;
                bestIndex = i;
                if (penalty === 0) break;
            }
        }

        chosenItem = balancedNumbers.splice(bestIndex, 1)[0];
        gridMatrix[r][c] = chosenItem || {t: 'n', v: 1, c: colors[0]};
    });

    // --- 5. تحويل المصفوفة إلى مصفوفة أحادية للرسم والتفاعل ---
    let pool = [];
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            pool.push(gridMatrix[r][c]);
        }
    }

    // --- 6. رسم الشبكة ---
    pool.forEach((d, i) => {
        const sq = document.createElement('div');
        sq.className = 'square';
        sq.id = 'sq-' + i;
        sq.innerHTML = `<span class="outer-num">${i+1}</span><div class="inner-face ${d.c}">${(d.t==='b'?'💣':(d.t==='x'?'x'+d.v:d.v))}</div>`;
        
        sq.onclick = () => {
            if(isProcessing || sq.classList.contains('open')) return;
            sq.classList.add('open');
            currentTurnHistory.push({ id: sq.id, data: d, teamIdx: currentTeamIdx, scoreBefore: teams[currentTeamIdx].score });
            if(d.t === 'b') { isProcessing = true; setTimeout(() => triggerExplosion(), 400); }
            else if(turnPicks.some(p => (p.c === d.c && p.t === 'n' && d.t === 'n') || (p.v === d.v && p.t === 'n' && d.t === 'n'))) {
                isProcessing = true; turnPicks = []; setTimeout(resetTurn, 1000);
            } else { turnPicks.push(d); updateSum(); }
        };
        grid.appendChild(sq);
    });

    
}    // ----------------------------------------   

function resetTurn() { document.querySelectorAll('.square.open').forEach(el => { el.classList.add('shatter'); el.classList.remove('open'); }); turnPicks = []; currentTeamIdx = (currentTeamIdx + 1) % teams.length; updateSum(); setTimeout(() => { isProcessing = false; renderTeams(); }, 800); }
function triggerExplosion() { if(ballsCount > 0) { document.getElementById('ball'+ballsCount).style.display = 'none'; ballsCount--; } playExplosionSound(); document.body.classList.add('shake'); const box = document.getElementById(`box-${currentTeamIdx}`); box.style.background = "#ff0000"; setTimeout(() => { teams[currentTeamIdx].score = 0; turnPicks = []; updateSum(); box.style.background = "#000"; resetTurn(); }, 1000); }
function playExplosionSound() { if (!audioCtx) return; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.5); }
function startCycle() { if(cycleInterval) clearInterval(cycleInterval); const cycle = () => { document.getElementById('text1').style.opacity = '0'; document.getElementById('text2').style.opacity = '1'; setTimeout(() => { document.getElementById('text2').style.opacity = '0'; document.getElementById('text1').style.opacity = '1'; }, 10000); }; cycle(); cycleInterval = setInterval(cycle, 50000); }
function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
generateInputs();
function declareWinner() {
    // ترتيب الفرق حسب السكور
    const sorted = [...teams].sort((a, b) => b.score - a.score);
    // عرض رسالة بسيطة
    alert("انتهت اللعبة! الفائز هو: " + sorted[0].name + " بـ " + sorted[0].score + " نقطة");
}
// هذا المحرك مسؤول عن تبديل النصوص في المربع الوسطي
setInterval(() => {
    const t1 = document.getElementById('text1');
    const t2 = document.getElementById('text2');
    if (t1 && t2) {
        if (t1.style.opacity === '0') {
            t1.style.opacity = '1';
            t2.style.opacity = '0';
        } else {
            t1.style.opacity = '0';
            t2.style.opacity = '1';
        }
    }
}, 3000);
// هذه دالة جديدة تماماً، لن تحذف أي شيء قديم
function calculateRealScore() {
    let total = 0;
    turnPicks.forEach((p, idx) => {
        if (p.t === 'n') total += p.v;
        else if (p.t === 'x' && idx > 0) total *= p.v;
    });
    return total;
}
// أضف هذه الدالة في نهاية منطقة السكربت:
function shuffleArray(array) {
    // استخدمنا ذاكرة عشوائية مشفرة عشان اللعبة تفقد الذاكرة تماماً
    const randomBuffer = new Uint32Array(1);
    
    // خلط مزدوج (Double Shuffle) لضمان تدمير أي نمط سابق
    for (let k = 0; k < 2; k++) {
        for (let i = array.length - 1; i > 0; i--) {
            window.crypto.getRandomValues(randomBuffer);
            // تحويل الرقم المشفر لنسبة عشوائية نقية 100%
            let randomFraction = randomBuffer[0] / (0xffffffff + 1);
            const j = Math.floor(randomFraction * (i + 1));
            
            // تبديل العناصر
            [array[i], array[j]] = [array[j], array[i]];
        }
    }
    return array;
}

function nextTurn() {
    // 1. إذا كانت اللعبة تعالج حركة (مثل انفجار)، نوقف الزر
    if (isProcessing || turnPicks.length === 0) return;

    // 2. حساب السكور
    let totalScore = 0;
    turnPicks.forEach((p, index) => {
        if (p.t === 'n') totalScore += p.v;
        else if (p.t === 'x' && index > 0) totalScore *= p.v;
    });

    // 3. إضافة السكور للفريق الحالي
    teams[currentTeamIdx].score += totalScore;
    
    // 4. إنهاء الدور يدوياً
    isProcessing = true; // نمنع اللمس حتى تنتهي الحركة
    resetTurn(); // هذه الدالة موجودة عندك وتتكفل بتغيير الدور وتصفير الـ picks
}
